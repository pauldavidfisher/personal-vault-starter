services:
  - type: web
    name: personal-vault-starter
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn vault_search_upload:app --bind 0.0.0.0:$PORT --chdir /opt/render/project/src
    envVars:
      - key: VAULT_PATH
        value: /opt/render/project/src/vault
      - key: DB_PATH
        value: /opt/render/project/src/vault/vault.db
      - key: HOST
        value: 0.0.0.0

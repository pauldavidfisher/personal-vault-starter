# Personal Vault — Demo Configuration
# For local use, edit vault.path to point at your notes folder.
# On Render, these values are overridden by environment variables.

vault:
  path: ./vault

database:
  path: ./vault/vault.db

server:
  port: 5002
  host: 127.0.0.1

app:
  name: Personal Vault
  welcome_quote: "Manners are of more importance than laws."
  welcome_quote_author: Edmund Burke
